  const adviceCatalog = Object.create(null);

  function round(value, digits) { const multiplier = Math.pow(10, digits === undefined ? 1 : digits); return Math.round((value + Number.EPSILON) * multiplier) / multiplier; }

  function format(value) { return finite(value) ? round(value).toFixed(1) : '—'; }
  function isAll(value) { return value === undefined || value === null || value === '' || value === 'all'; }
  function compareText(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function selectedStudents(studentIds) {
    const ids = Array.isArray(studentIds) ? new Set(studentIds.map(function (item) { return typeof item === 'string' ? item : item && item.id; })) : null;

  }

  }
  function previousTerm(term) {

    const advice = adviceCatalog[indicator.key];

    const cycle = '【假设】4周，第4周复核';
    return {
      studentId: student.id, studentName: student.name, classId: student.classId, className: student.className,
      term: term, systemId: scope.systemId, dimensionKey: indicator.dimensionKey, dimensionName: indicator.dimensionName,

  function analyze(input) {
    const request = input || {};
    const term = request.term || D.currentTerm;
    const scope = resolveScope(request.scope, term);
    const configured = scope.valid && scope.activity && scope.activity.participantIds !== undefined ? new Set(scope.activity.participantIds) : null;
    const students = selectedStudents(request.studentIds).filter(function (student) { return !configured || configured.has(student.id); });
    const earlierScope = scope.valid && !scope.options.month ? F.previousScope(term,scope.options) : null;

      const records=modalRecords(),pages=Math.max(1,Math.ceil(records.length/6));
      modalState.page=Math.min(Math.max(1,modalState.page||1),pages);
      body=`<p class="tg-caption">${modalState.subjectId?esc(byId(roleGroups(),modalState.subjectId)?.name)+'组 · ':'当前报告范围内'}共 ${records.length} 条 · 示例评价原文与文字佐证${applied.mode==='team'?inlineHelp('teamRecords'):''}</p><div class="tg-feedback-list">${records.slice((modalState.page-1)*6,modalState.page*6).map(r=>{const area=areas().find(a=>a.id===r.areaId),item=area?.items.find(i=>i.id===r.itemId);return `<div class="tg-feedback-item"><div class="tg-feedback-head"><strong>二级指标：${esc(item?.name)}</strong><span class="tg-role-tag">${esc(applied.mode==='personal'?D.roleGroupFor(r.roleId)?.feedbackName:byId(roleGroups(),D.roleGroupFor(r.roleId)?.id)?.name)}</span>${applied.mode==='team'?inlineHelp('teacherRecordSubject'):''}<span class="tg-caption">${pct(D.normalizedScore(r))}（原始 ${esc(r.score??'—')} / ${esc(r.maxScore??'—')} 分）${D.scoreIssue(r)?`<span class="tg-score-issue">${esc(D.scoreIssue(r))}</span>`:''}${applied.mode==='team'?inlineHelp('teacherRecordScore'):''}</span></div><p>${esc(r.comment)}</p><div class="tg-feedback-head"><span class="tg-caption">一级指标：${esc(area?.name)} · ${esc(byId(D.teachers,r.teacherId).name)} · ${esc(r.date)} · 记录${esc(r.id)}</span>${link('查看文字佐证','evidence',`data-id="${r.id}"`)}</div></div>`;}).join('')||'<div class="tg-empty">暂无符合条件的记录。</div>'}</div><div class="tg-pagination">${btn('上一页','record-page',`data-page="${modalState.page-1}" ${modalState.page===1?'disabled':''}`)}<span>${modalState.page} / ${pages}</span>${btn('下一页','record-page',`data-page="${modalState.page+1}" ${modalState.page===pages?'disabled':''}`)}</div>`;
    }
    el.innerHTML=`<section class="tg-modal${modalState.type==='prd'?' tg-prd-modal':''}" role="dialog" aria-modal="true" aria-labelledby="tg-modal-title"><div class="tg-modal-head"><h2 id="tg-modal-title">${esc(title)}</h2><button class="ga-link" data-action="tg-close" aria-label="关闭对话框">✕</button></div><div class="tg-modal-body">${body}</div><div class="tg-modal-foot">${modalState.type==='evidence'?btn('返回评价记录','record-back'):''}${btn('关闭','close')}</div></section>`;
    main.inert=true;root.querySelector('.ga-sidebar').inert=true;root.querySelector('.ga-tabs').inert=true;
    el.querySelector('button').focus();
  }
  function openModal(state,trigger) {modalState=state;modalTrigger=trigger;renderModal();}
  function closeModal() {
    const trigger=modalTrigger;
    document.getElementById('tg-modal')?.remove();main.inert=false;root.querySelector('.ga-sidebar').inert=false;root.querySelector('.ga-tabs').inert=false;modalState=null;modalTrigger=null;
    trigger?.focus();
    // Restore focus after inert removal and the closing keyboard event have settled.
    setTimeout(()=>{if(!modalState&&trigger?.closest('#ga-main'))trigger.focus({preventScroll:true});},0);
  }
  function exportReport() {
    const clone=document.getElementById('tg-report').cloneNode(true);
    const exportedRecords=clone.querySelector('#tg-records-content');
    if(exportedRecords)exportedRecords.innerHTML=personalRecordsHTML(true,true);
    clone.querySelectorAll('.ga-no-print,.tg-actions,.tg-stat-help,.tg-inline-help,.ga-help-wrap,[data-help-key]').forEach(el=>el.remove());
    clone.querySelector('.tg-display-control')?.remove();
    const displayLabel=clone.querySelector('.tg-display-static');
    if(displayLabel)displayLabel.setAttribute('style','display:block');
    clone.querySelectorAll('button,a').forEach(el=>el.remove());
    const css=document.getElementById('ga-styles').textContent;
    const html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师成长${applied.mode==='personal'?'个人报告':'团队分析报告'}（示例数据）</title><style>body{margin:0;background:#fff}${css}</style></head><body><div id="ga-root" class="tg-teacher-mode">${clone.outerHTML}</div></body></html>`;
    const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=`教师成长报告_${applied.mode==='personal'?byId(D.teachers,applied.teacherId).code:applied.departmentId}_${applied.periodId}_${applied.mode==='personal'?'个人报告':'团队分析'}_示例数据.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出当前范围报告（示例数据）');
  }
  root.addEventListener('submit',e=>{if(e.target.id==='tg-filter'){e.preventDefault();e.stopImmediatePropagation();apply();}},true);
  root.addEventListener('change',e=>{
    if(e.target.closest('#tg-filter')){
      draft[e.target.name]=e.target.value;
      if(e.target.name==='activityId'){
        draft.areaId='all';draft.itemId='all';
        if(!activityTeachers(draft).some(t=>t.id===draft.teacherId))draft.teacherId=activityTeachers(draft)[0]?.id||'';
        root.querySelector('#tg-filter').outerHTML=filterHTML();
      }
      if(e.target.name==='areaId'){draft.itemId='all';const itemSelect=root.querySelector('[name="itemId"]');if(itemSelect)itemSelect.innerHTML=itemOptions();}
      if(e.target.name==='itemId'&&draft.itemId!=='all'){
        draft.areaId=areas(draft).find(a=>a.items.some(i=>i.id===draft.itemId)).id;
        root.querySelector('[name="areaId"]').value=draft.areaId;
        root.querySelector('[name="itemId"]').innerHTML=itemOptions();
      }
      syncDirty();
    }
    if(e.target.id==='tg-record-activity'){recordState={activityId:e.target.value,areaKey:'all',page:1};refreshPersonalRecords();document.getElementById('tg-record-activity')?.focus({preventScroll:true});}
    if(e.target.id==='tg-record-area'){recordState={...recordState,areaKey:e.target.value,page:1};refreshPersonalRecords();document.getElementById('tg-record-area')?.focus({preventScroll:true});}
    if(e.target.id==='tg-display-area'){displayAreas[applied.mode]=e.target.value;render();document.getElementById('tg-display-area')?.focus({preventScroll:true});}
    if(e.target.id==='tg-compare'){compare=e.target.checked;render();}
  });
  root.addEventListener('click',e=>{
    const target=e.target.closest('[data-action^="tg-"]');
    if(!target)return;
    e.preventDefault();e.stopImmediatePropagation();
    const action=target.dataset.action.slice(3);
    if(action==='mode'){
      const mode=target.dataset.mode;if(mode===applied.mode)return;
      modeStates[applied.mode]={...applied};modeCompares[applied.mode]=compare;
      applied={...modeStates[mode],mode};if(mode==='personal')applied.itemId='all';
      compare=modeCompares[mode];draft={...applied};render();
    }
    else if(action==='reset'){applied={...initial(),mode:applied.mode};modeStates[applied.mode]={...applied};displayAreas[applied.mode]=null;draft={...applied};compare=true;if(applied.mode==='personal'){recordContext='';recordState={activityId:'all',areaKey:'all',page:1};}render();}
    else if(action==='prd')openModal({type:'prd'},target);
    else if(action==='prd-section'){const section=document.getElementById('tg-prd-section-'+target.dataset.index);section?.scrollIntoView({block:'start'});section?.querySelector('h3')?.focus({preventScroll:true});}
    else if(action==='records')openModal({type:'records',areaId:target.dataset.area||'',itemId:target.dataset.item||'',roleId:target.dataset.role||'',subjectId:target.dataset.subject||'',page:1},target);
    else if(action==='inline-record-page'){recordState.page=Number(target.dataset.page);refreshPersonalRecords();}
    else if(action==='record-page'){modalState.page=Number(target.dataset.page);renderModal();}
    else if(action==='evidence'){modalState={...modalState,type:'evidence',recordId:target.dataset.id};renderModal();}
    else if(action==='record-back'){modalState.type='records';renderModal();}
    else if(action==='close')closeModal();
    else if(action==='export')exportReport();
    else if(action==='print')window.print();
  },true);
  root.addEventListener('click',e=>{if(e.target.id==='tg-modal')closeModal();});
  root.addEventListener('keydown',e=>{
    if(!modalState)return;
    if(e.key==='Escape'){e.stopImmediatePropagation();closeModal();}
    if(e.key==='Tab'){
      const buttons=[...document.querySelectorAll('#tg-modal button:not([disabled]),#tg-modal a[href]')];
      if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1)?.focus();}
      else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0]?.focus();}
    }
  },true);
  new MutationObserver(()=>{
    if(main.querySelector('.ga-teacher-empty'))render();
    else if(!main.querySelector('#tg-report'))root.classList.remove('tg-teacher-mode');
  }).observe(main,{childList:true});
  window.addEventListener('beforeprint',()=>{
    if(applied.mode!=='personal'||!main.querySelector('#tg-report')||printRecordsSnapshot!==null)return;
    const container=document.getElementById('tg-records-content');if(container){printRecordsSnapshot=container.innerHTML;container.innerHTML=personalRecordsHTML(true,true);}
  });
  window.addEventListener('afterprint',()=>{
    if(printRecordsSnapshot===null)return;const container=document.getElementById('tg-records-content');if(container)container.innerHTML=printRecordsSnapshot;printRecordsSnapshot=null;
  });
  window.TeacherReportUI={getState:()=>({...applied}),getRecordState:()=>({...recordState}),getDisplayAreaId:()=>displayAreas[applied.mode],render};
  window.addEventListener('hashchange',()=>{
    if(window.location.hash==='#teachers')root.querySelector('.ga-sidebar [data-page="teachers"]').click();
  });
  if(main.querySelector('.ga-teacher-empty'))render();
  else if(window.TeacherReportConfig?.autoOpen!==false||window.location.hash==='#teachers') {
    root.querySelector('.ga-sidebar [data-page="teachers"]').click();
  }
})();

</script>

</body></html>
