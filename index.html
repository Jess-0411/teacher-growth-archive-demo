  const adviceCatalog = Object.create(null);

    adviceCatalog[indicator.key] = { indicatorKey: indicator.key, systemId: indicator.systemId, dimensionKey: indicator.dimensionKey, indicatorName: indicator.name, action: row[3], processGoal: row[4], owner: row[5], evidence: row[6], source: indicator.source, isDemo: true, isSuggestion: true };

  function format(value) { return finite(value) ? round(value).toFixed(1) : '—'; }
  function isAll(value) { return value === undefined || value === null || value === '' || value === 'all'; }
  function compareText(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

    const ids = Array.isArray(studentIds) ? new Set(studentIds.map(function (item) { return typeof item === 'string' ? item : item && item.id; })) : null;
    return D.students.filter(function (student) { return !ids || ids.has(student.id); }).slice().sort(function (a, b) { return compareText(a.id, b.id); });
  }

    const previousScore = previous ? finite(previous.rawScore) ? previous.rawScore : previous.score : null;
    const advice = adviceCatalog[indicator.key];
    const targetScore = Math.min(config.alertThreshold, round(score + config.maxTargetIncrease, 2));
    const cycle = '【假设】4周，第4周复核';
    return {
      studentId: student.id, studentName: student.name, classId: student.classId, className: student.className,
      term: term, systemId: scope.systemId, dimensionKey: indicator.dimensionKey, dimensionName: indicator.dimensionName,

  function analyze(input) {
    const request = input || {};
    const term = request.term || D.currentTerm;
    const scope = resolveScope(request.scope, term);
    const configured = scope.valid && scope.activity && scope.activity.participantIds !== undefined ? new Set(scope.activity.participantIds) : null;
    const students = selectedStudents(request.studentIds).filter(function (student) { return !configured || configured.has(student.id); });
    const earlierScope = scope.valid && !scope.options.month ? F.previousScope(term,scope.options) : null;
    const termDefinition = D.terms.find(function (item) { return item.id === term; }) || null;

      const earlierItems = result.previousTerm ? flatten(F.analyze([student.id], result.previousTerm, earlierScope)) : [];
      items.forEach(function (indicator) {
        const score = finite(indicator.rawScore) ? indicator.rawScore : indicator.score;
        if (!indicator.count || !finite(score) || score >= config.alertThreshold) return;
        const previous = earlierItems.find(function (item) { return item.key === indicator.key && item.count > 0; }) || null;

    alerts.sort(function (a, b) { return a.rawScore - b.rawScore || compareText(a.studentId, b.studentId) || compareText(a.indicatorKey, b.indicatorKey); });
    result.alertItemCount = alerts.length;

    if (missingStudents.length) decisionSuggestions.push({
      title: '先补齐所选范围的评价记录',
      basis: '应纳入' + students.length + '人，完整评价' + result.evaluatedCount + '人，缺少完整评价' + missingStudents.length + '人。',
      action: '建议核对学生名册、评价范围与记录有效状态，再安排补齐观测；数据缺失不作为能力不足或不达标结论。',

      const names = dimension.indicators.filter(function (indicator) { return matching.some(function (alert) { return alert.indicatorKey === indicator.key; }); }).map(function (indicator) { return indicator.name; });
      decisionSuggestions.push({
        title: dimension.name + '开展分层支持',
        basis: '当前范围内' + studentCount + '名学生存在' + matching.length + '项未达标提示，涉及' + names.join('、') + '。',

        systemId: scope.options.systemId, dimensionKey: dimension.key, studentCount: studentCount, alertItemCount: matching.length,
        isSuggestion: true, isDemo: true

      title: '保持已达标表现并持续观察',

    const support = analyze({ studentIds: student ? [student.id] : [], term: request.term, scope: request.scope });

        {
          "title": "4. 功能需求列表",
          "html": "<div class=\"tg-table-wrap\"><table><thead><tr><th>功能模块</th><th>功能点</th><th>需求描述</th><th>优先级（P0 / P1 / P2）</th><th>备注说明</th></tr></thead><tbody><tr><td>部门</td><td>含下级授权范围</td><td>默认全部部门，直属及全部下级教师并集与活动名单、用户授权取交集，按教师ID去重。</td><td>P0</td><td>departmentId不覆盖teamId</td></tr><tr><td>统计</td><td>四卡与计算口径</td><td>固定展示应被评价教师、被评价教师覆盖率、有效评价记录数、平均得分率；删除顶部完整评价覆盖率、评分人参与率，不恢复评分任务完成度。记录含无法计分业务有效记录；teamAverageScoreRate先教师内有结果二级等权，再有效教师等权；scoringTeacherCount辅助显示参与计算教师N人。页面无问号，隐藏口径进入静态说明。</td><td>P0</td><td>记录不代替任务或人数</td></tr><tr><td>页面</td><td>删除两个模块</td><td>删除成员评价情况、部门对照及对应入口，剩余章节连续编号；保留顶部部门筛选和统计。</td><td>P0</td><td>本版替代旧成员/部门展示规则</td></tr><tr><td>主体</td><td>汇总与纵向明细</td><td>固定教师、家长/学生两行汇总；下方按主体展示固定列一级指标、二级指标、团队均值得分率、有效教师；指标名称仅作为行值。</td><td>P0</td><td>不受顶部另一主体限制</td></tr><tr><td>依据</td><td>主体独立查询</td><td>记录入口仅替换主体，其余部门、活动、周期、指标与授权条件保留；分页、佐证和返回保留作用域。</td><td>P0</td><td>汇总和记录不受报告内一级指标收窄</td></tr><tr><td>层级</td><td>字段与稳定标识</td><td>页面、计算口径、记录、导出打印及PRD使用评价活动、一级指标、二级指标；不新增评价类型层；保留activityId/areaId/itemId兼容键。</td><td>P0</td><td>名称不代替唯一标识</td></tr><tr><td>计分</td><td>二级得分率</td><td>记录按score/maxScore×100归一；个人同二级记录等权；团队和个人比较平均值先个人后教师等权；一级仅分类。</td><td>P0</td><td>任务完整性独立</td></tr><tr><td>诊断</td><td>四类确定性模板</td><td>当前报告内一级指标下按最高、最低及全部并列项匹配；覆盖空、单项、均衡、部分缺失和团队样本不足；词库使用稳定三级标识。</td><td>P0</td><td>完整映射见本PRD第5章</td></tr><tr><td>表现</td><td>报告内一级指标</td><td>默认当前报告范围首个含二级指标的一级；联动二级数值表、分析建议、周期及主体分项，不改变统计卡、全量明细或整组记录。</td><td>P0</td><td>一级不计分</td></tr><tr><td>输出</td><td>全量HTML与打印</td><td>保留静态报告内一级指标及当前范围全部二级明细；个人追加局部筛选后的全部记录，不只输出当前20条；移除操作、隐藏计算元数据、筛选及PRD，保留静态计算说明。</td><td>P0</td><td>输出使用已应用快照</td></tr><tr><td>开发规则</td><td>PRD弹窗</td><td>个人与团队各保留九章和固定五列功能表；显示当前已应用范围；支持关闭、遮罩、Escape、Tab焦点循环及入口焦点恢复。</td><td>P1</td><td>不应用草稿、不进入输出</td></tr><tr><td>表现</td><td>全宽数值表</td><td>两页评价表现删除条形图和任务完成列，改全宽单列表格布局。团队固定列为二级指标、团队均值得分率、有效教师。</td><td>P0</td><td>周期对照图保留</td></tr><tr><td>计算口径</td><td>无可见提示与静态说明</td><td>移除统计卡、表头、标题、列表、图表及记录弹窗中的计算问号和包装占位；同位置仅保留隐藏口径元数据。导出打印收集已应用范围后删除元数据，末尾保留去重计算说明。</td><td>P0</td><td>不改变评分或其他操作入口</td></tr></tbody></table></div>"

        {
          "title": "5. 核心流程与交互说明",
          "html": "<ol><li>部门树根为校长，子部门依次政教处、教导处、门卫、后勤部、工会、党务部、财务处、校务办。选择部门含全部下级，教师并集与活动名册、用户授权取交集，按教师ID去重。</li><li>顶部保留活动、周期、一级、二级与主体筛选；主体恰为全部、教师、家长/学生。切活动重置两级，切一级重置二级，二级必须属于当前活动与一级。</li><li>顶部按顺序仅展示应被评价教师、被评价教师覆盖率、有效评价记录数、平均得分率四卡，均匀排列，无问号、浮层入口或占位。删除顶部完整评价覆盖率、评分人参与率，不恢复评分任务完成度；内部统计及其他表格保留既有口径。平均得分率下显示“参与计算教师 N 人”，使用已应用报告范围，不受报告内展示一级指标切换影响。删除成员评价情况和部门对照整个模块及入口，章节连续编号；部门筛选与含下级计算继续生效。</li><li>报告头删除规则版本、数据截至及成绩摘要，页尾不重复规则版本；活动、周期及当前范围保留。</li><li>团队评价表现仅展示全宽数值表，固定列为二级指标、团队均值得分率、有效教师；删除条形图及任务完成列，周期对照图保留。报告内选择器显示一级指标，辅助功能名称为报告展示一级指标。</li><li>所有剩余表格使用固定字段表头；一级、二级指标名称仅作为数据行。报告内一级指标联动二级数值表、分析建议、周期及主体纵向明细，不改变卡片、全量二级明细和主体汇总。</li><li>主体汇总固定教师、家长/学生两行，固定列为评价主体、完整评价教师、有效评价记录、评价依据。下方分别展示两个主体的一级指标、二级指标、团队均值得分率、有效教师纵向表。</li><li>固定两组忽略顶部主体条件，保留其余部门、活动、周期、指标、规则与授权；每个二级独立样本。完整教师与有效记录按整组范围，不按纵向行重复累计。无数据保留两组，成绩—，人数与记录0。</li><li>主体查看记录独立保存该组范围，不受顶部另一主体或报告内一级指标阻挡；记录弹窗沿用每页6条，佐证返回保持页码及作用域。</li><li>导出打印保留当前报告内一级指标静态文字、全部二级明细和固定两组结果，移除隐藏计算元数据、筛选、操作与PRD控件，保留报告末尾静态计算说明。</li></ol><!--TEACHER_TEMPLATE_TABLES--><h4>计算口径元数据与输出</h4><p>个人、团队的统计卡、标题、表头、列表、诊断结果、周期图系列、数值摘要及记录弹窗均不显示问号，不保留交互提示节点、焦点、ARIA弹窗关联或专属占位。每个实际计算字段继续输出hidden元数据，保存口径键与当前已应用范围。普通PRD、记录、佐证和筛选操作保持。</p><p>GrowthHints.tip返回空文本hidden span；teacherTip、metricHead、calculationMeta直接保留该元数据，不创建空的提示包装。HTML导出先展开个人全量记录，再收集实际data-help-key与data-help-scope，按键去重并列出所有实际范围，追加静态计算说明后移除元数据。打印同样先展开全量记录后收集，重复打印不追加重复附录；afterprint清理附录并恢复原分页。范围不读取未提交草稿。</p>"
        },
        {
          "title": "6. 异常场景与边界条件",
          "html": "<ul><li>有效0%参与均值与相对比较；缺失显示—；有业务有效记录但全部无法计分时仍显示记录数，团队平均得分率显示“—”、参与计算教师0人；有效0%与部分评价已有结果参与团队平均。</li><li>部分任务完成可形成二级结果，任务缺口不认定为能力或师德问题；无应任务、应教师或应评分人数时比例—。</li><li>指标目录为空显示空态，不补齐固定四分类；团队单二级筛选不生成一级成绩。</li><li>显示保留一位小数，但最高、最低、并列均使用未取整结果；显示相同不等于并列。</li><li>周期结果独立计算，两期缺任一期有效结果或规则不可比时不计算百分点变化。</li><li>【假设】真实接口失败保留上一成功快照，过期响应不得覆盖最新查询；记录与佐证均须服务端授权校验。</li><li>PRD打开、关闭及记录佐证操作不应用顶部草稿，不改报告筛选。</li></ul><ul><li>任务已完成但评分/满分无效：覆盖、参与与任务完整性仍按recordId业务关联统计；该评分不进入二级均值及计分样本。禁止以任务完成替代评分有效性。</li><li>页面无可见计算问号、空包装、占位或计算浮层焦点；记录弹窗Escape继续直接关闭记录弹窗。320—1440px不产生提示占位或溢出。</li><li>零分、零分母、部分评价、无任务、无有效结果、历史不可比及未取整并列判断均按原算法解释；教师不引入学生60%规则。</li></ul>"
        },
        {
          "title": "7. 数据口径与埋点需求",
          "html": "<p>统一字段为“评价活动 → 一级指标 → 二级指标”。activityId、areaId、itemId为兼容标识；不新增评价类型目录，不将一级指标或内部评分模板称为评价类型。</p><p>逐记录score、maxScore须为有限数，maxScore＞0且0≤score≤maxScore。合法记录得分率＝score÷maxScore×100%；个人同二级对记录得分率取均值，有一条有效评分即可形成结果；缺失不补零。缺少满分、非法满分及越界保留业务记录与提交状态，但不计入得分率或计分样本并返回原因。一级不返回score、scoreRate等成绩。</p><p>个人逐项“平均值”为同活动全部授权教师（包含本人）的有效个人二级结果等权均值；团队二级结果为所选部门含下级授权教师等权均值，各项样本独立。个人顶部“平均得分率”仅为该教师当前报告范围有结果的二级指标等权均值，不替代逐项全活动平均值。</p><p>有效记录数使用业务有效记录，不等于可计分记录、任务数或评分人数；底层任务完成、完整教师和参与人数继续独立统计；本轮不新增接口，删除页面任务完成展示不删除内部字段。周期差值为当前减上一周期，单位个百分点。</p><p>完整评价教师、有效评价记录取主体整组报告范围；纵向二级的有效教师分子分母各自计算。固定主体只替换原始主体集合。</p><p>【假设】埋点包括查询、模式切换、报告内一级指标、模板命中、记录局部筛选/分页、佐证查看、导出、打印调用及PRD开关。只记录稳定范围标识、模板ID、状态、结果和计数，不采集姓名、评语全文或附件内容。打印调用不代表实际打印完成。</p><p>任务完成＝任务recordId存在且关联当前范围业务记录；不要求score/maxScore可计算。被评价覆盖分子为完成任务去重教师，分母为任务去重教师；评分人参与分子为完成任务去重raterId，分母为任务去重raterId。完整评价按所选必评任务全部完成判断，无任务项不判完整。业务记录数含无法计分记录；评分有效记录要求有限score/maxScore、maxScore＞0且0≤score≤maxScore。</p><p>个人二级先有效记录归一后平均，团队二级先个人再有效教师等权；顶部个人平均得分率再按有结果的二级等权；逐项全活动平均值包含本人，不受部门收窄。周期差为未取整结果相减，展示一位小数/个百分点。诊断个人仅当前展示一级内可计算项，团队另要求每项n≥2，最高最低及并列使用未取整值。</p><p>GrowthHints保留旧键及结构化口径label/formula/logic/scope/validity/precision；validity继续说明样本与缺失。tip(key,{scope})仅返回无文本、无焦点、无ARIA交互的hidden span，保存data-help-key/scope。appendNotes/preparePrint从实际报告隐藏元数据收集、按键去重并列出全部已应用范围；不收集PRD、草稿或报告外字段。页面不提供计算浮层，不再采集计算提示开关埋点；查询、导出、打印和PRD等既有埋点保留。</p><p>团队顶部有效评价记录数按当前已应用部门（含下级去重）、活动、周期、指标及主体范围查询业务有效记录，包含无法计分记录，不等于计分记录、任务、教师或评分人数。teamAverageScoreRate先对每位教师有结果的二级scoreRate取算术均值，再对这些个人均值按教师等权平均；scoringTeacherCount为至少有一个可计算二级结果的去重教师数，显示“参与计算教师 N 人”。不按记录数、任务数或各二级样本数加权，也不直接平均各团队二级均值；报告内展示一级指标切换不改变该顶部摘要。</p><p>团队平均计算保留未取整精度，展示一位小数；有效0%及部分评价已有结果均纳入，缺失不补零。没有可计算教师时teamAverageScoreRate为空、显示“—”，scoringTeacherCount为0，业务记录数仍可大于0；无应评价教师时覆盖率“—”，空记录集合显示0。顶部移除完整评价覆盖率与评分人参与率不删除内部字段，不改变完整评价教师、主体表格、逐项团队均值或个人全活动平均值。</p>"
        },
        {
          "title": "8. 风险、依赖与限制",
          "html": "<p>【假设】现有合成示例仍为1个活动、12名教师、4个一级指标、20个二级指标、4类原始主体及2个周期，各二级示例满分5分；真实计算读取记录满分快照。真实组织、授权、任务名单、有效记录版本及可比性依赖上游接口；本原型不执行生产写入。浏览器、真实下载、实际打印预览及生产接口单独记录，不把未执行项标记通过。</p><p>【假设】静态计算说明仅适用于HTML报告与打印件，CSV结构保持。共用提示组件由学生与教师共用，教师键保持独立；交付须同步重建集成会话预览与教师独立HTML。本轮新增顶部团队平均及参与计算教师数字段，不修改原始记录、逐项评分、任务完整性、其他表格样本或诊断规则。</p>"
        },

  else if(window.TeacherReportConfig?.autoOpen!==false||window.location.hash==='#teachers') {
    root.querySelector('.ga-sidebar [data-page="teachers"]').click();
  }
})();

</script>
